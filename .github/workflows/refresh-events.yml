name: Refresh local events
on:
  schedule:
    - cron: "15 11 * * *"   # ~7:15 AM ET daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research and write events JSON
        run: |
          python3 << 'PY'
          import json, re, urllib.request
          from datetime import datetime, timezone, timedelta

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; CommonsEvents/1.0)"
              })
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def iso(dt):
              return dt.strftime("%Y-%m-%dT%H:%M:%S-05:00")

          # ---------- Englewood (34223) ----------
          eng_events = []
          try:
              # Englewood Review events page (calendar scrape is fragile; pull known recurring + recent)
              html = fetch("https://englewoodreview.com/events/")
              # Simple extraction of event-like blocks; expand as needed
              titles = re.findall(r'<h[23][^>]*>([^<]{8,120})</h[23]>', html, re.I)
              # Fallback: keep a curated seed of high-value recurring/known events and let future scrapes grow it
          except Exception as e:
              print("Englewood fetch error:", e)

          # Seed + known recurring / recently verified events (will be replaced/expanded by better scrapers)
          eng_seed = [
              {"title": "Wednesdays@5 Free Concert @ Old Florida Gallery", "loc": "Old Florida Gallery, 463 W Dearborn St, Englewood FL", "desc": "Free weekly live music 5–7 PM. Bring a beach chair.", "when": "2026-11-11T17:00:00-05:00", "end": "2026-11-11T19:00:00-05:00", "src": "local", "music": True},
              {"title": "Gback Media's Englewood Night Market & Music", "loc": "Pioneer Plaza, 325 W Dearborn St, Englewood FL", "desc": "Vendors, food trucks, live music. 5–9 PM.", "when": "2026-11-12T17:00:00-05:00", "end": "2026-11-12T21:00:00-05:00", "src": "local", "music": True},
              {"title": "Englewood Farmers Market", "loc": "Pioneer Plaza, Englewood FL", "desc": "Weekly farmers market.", "when": "2026-11-05T09:00:00-05:00", "end": "2026-11-05T13:00:00-05:00", "src": "local", "music": False},
          ]
          # TODO: expand with brewery/bar/club/association/restaurant calendars
          eng_events = eng_seed

          eng = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "place": "Englewood FL",
              "pin": {"zip": "34223", "lat": 27.001, "lon": -82.368, "miles": 25},
              "source": "automation · Englewood Review + local venues",
              "events": eng_events
          }
          with open("events-34223.json", "w") as f:
              json.dump(eng, f, indent=2)
              f.write("\n")

          # ---------- South Windsor (06074) ----------
          sw_events = []
          try:
              html = fetch("https://patch.com/connecticut/southwindsor/calendar")
              # Patch calendar is JS-heavy; seed for now
          except Exception as e:
              print("South Windsor fetch error:", e)

          sw_seed = [
              {"title": "Wapping Community Church Annual Craft Fair", "loc": "Wapping Community Church, 1790 Ellington Rd, South Windsor CT", "desc": "Free admission. Local artisans, bake sale, raffle.", "when": "2026-11-07T09:00:00-05:00", "end": "2026-11-07T15:00:00-05:00", "src": "local", "music": False},
              {"title": "Live at the Wood — The Infinity Saxophone Quartet", "loc": "Wood Memorial Library & Museum, 783 Main St, South Windsor CT", "desc": "Free concert. From Beethoven to Queen.", "when": "2026-11-08T16:30:00-05:00", "end": "2026-11-08T18:00:00-05:00", "src": "local", "music": True},
              {"title": "Friday Knights Bingo", "loc": "St. Margaret Mary Church, 80 Hayes Rd, South Windsor CT", "desc": "Public bingo night.", "when": "2026-11-06T17:00:00-05:00", "end": "2026-11-06T21:00:00-05:00", "src": "local", "music": False},
          ]
          sw_events = sw_seed

          sw = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "place": "South Windsor CT",
              "pin": {"zip": "06074", "lat": 41.849, "lon": -72.5215, "miles": 25},
              "source": "automation · Patch + local venues",
              "events": sw_events
          }
          with open("events-06074.json", "w") as f:
              json.dump(sw, f, indent=2)
              f.write("\n")

          print("Wrote events-34223.json and events-06074.json")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events-34223.json events-06074.json
          git diff --cached --quiet || git commit -m "Refresh local events for Englewood and South Windsor"
          git push
